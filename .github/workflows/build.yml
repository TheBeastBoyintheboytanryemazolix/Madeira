name: Build Madeira

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Prepare VC runtime
        run: |
          chmod +x tools/fetch-vcruntime.sh
          ./tools/fetch-vcruntime.sh

      - name: Build Madeira
        run: |
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned
          path: Madeira.ipa
